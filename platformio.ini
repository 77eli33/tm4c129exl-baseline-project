[platformio]
default_envs = tm4c129exl

[env]
platform = titiva@3.1.0
platform_packages = platformio/toolchain-gccarmnoneeabi@1.100301.220327
board = lptm4c1294ncpdt
; EK-TM4C129EXL uses TM4C129ENCPDT. The compatible LaunchPad manifest
; supplies the memory layout and on-board TI-ICDI probe configuration.
board_build.mcu = tm4c129encpdt
board_build.ldscript = linker.ld
upload_protocol = ti-icdi
debug_tool = ti-icdi
build_flags = -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 -ffunction-sections -fdata-sections -fno-builtin -nostdlib -Wl,--gc-sections -Wall -Wextra -I. -Ldriverlib/gcc -ldriver

[env:tm4c129exl]

[env:tm4c129exl_debug]
build_type = debug
debug_build_flags = -O0 -g3 -ggdb3
